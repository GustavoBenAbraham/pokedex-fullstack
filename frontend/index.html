<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex | Gustavo Ben</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🔴 Pokédex</h1>
            <p>Explore o mundo Pokémon</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar Pokémon por nome ou número...">
            <button onclick="buscarPokemon()">🔍 Buscar</button>
        </div>

        <div class="type-filters" id="typeFilters">
            <button class="type-btn active" onclick="filtrarPorTipo('todos')">Todos</button>
            <button class="type-btn fire" onclick="filtrarPorTipo('Fire')">Fogo</button>
            <button class="type-btn water" onclick="filtrarPorTipo('Water')">Água</button>
            <button class="type-btn grass" onclick="filtrarPorTipo('Grass')">Planta</button>
            <button class="type-btn electric" onclick="filtrarPorTipo('Electric')">Elétrico</button>
            <button class="type-btn psychic" onclick="filtrarPorTipo('Psychic')">Psíquico</button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="pokeball"></div>
            <p>Carregando...</p>
        </div>

        <div id="pokemonGrid" class="pokemon-grid"></div>

        <div class="pagination" id="pagination">
            <button onclick="paginaAnterior()" id="btnAnterior">← Anterior</button>
            <span id="paginaAtual">Página 1</span>
            <button onclick="proximaPagina()" id="btnProximo">Próximo →</button>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
